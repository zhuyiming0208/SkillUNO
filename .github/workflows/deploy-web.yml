name: Deploy Web Store

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'mods/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Copy mod data into web
        run: |
          mkdir -p web/mods web/collections
          cp mods/*.json web/mods/
          cp mods/collections.json web/collections/

      - name: Export skills to web
        env:
          PYTHONPATH: src
        run: python tools/export_skills.py

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'web'

      - id: deployment
        uses: actions/deploy-pages@v4
