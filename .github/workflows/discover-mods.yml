name: Discover Mods

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run discovery
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/discover_mods.py

      - name: Get current date
        id: date
        run: echo "today=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: auto-discover mods ${{ steps.date.outputs.today }}"
          title: "Auto-discovered mods ${{ steps.date.outputs.today }}"
          body: |
            自动发现的新模组，请审核后合并。

            **请重点检查"移除"列表**，确认没有误删。
          branch: auto-discover-mods
          delete-branch: true
          add-paths: |
            mods/
