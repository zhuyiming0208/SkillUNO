[project]
name = "skilluno"
version = "1.18.2"
description = "一个基于 Python 的 UNO 卡牌游戏框架"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
dependencies = [
    "rich>=13.0",
]

[project.scripts]
skilluno = "uno.main:cli_entry"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
omit = [
    "src/uno/main.py",
    "src/uno/ui.py",
    "src/uno/season3.py",
]
