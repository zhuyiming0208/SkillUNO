<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillUNO 模组商店</title>
    <meta name="description" content="SkillUNO 模组商店 —— 浏览、搜索、安装社区模组">
    <meta name="theme-color" content="#0d1117">
    <meta property="og:title" content="SkillUNO 模组商店">
    <meta property="og:description" content="浏览、搜索、安装社区模组">
    <meta property="og:type" content="website">
    <link rel="icon" type="image/svg+xml" href="/SkillUNO/favicon.svg">
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
    <header class="site-header">
        <h1 class="logo">SkillUNO</h1>
        <p class="tagline">// 模组商店 · 由社区驱动</p>
    </header>

    <main>
        <section class="section">
            <h2 class="section-title">
                <span class="prompt">&gt;</span> 官方模组
            </h2>
            <div id="official-grid" class="mod-grid">
                <p class="loading">加载中...</p>
            </div>
        </section>

        <section class="section">
            <h2 class="section-title">
                <span class="prompt">&gt;</span> 精选模组
            </h2>
            <div id="handpicked-grid" class="mod-grid">
                <p class="loading">加载中...</p>
            </div>
        </section>

        <section class="section">
            <h2 class="section-title">
                <span class="prompt">&gt;</span> 模组集
            </h2>
            <div id="collection-grid" class="mod-grid">
                <p class="loading">加载中...</p>
            </div>
            <p class="section-more">
                <a href="collections/index.html" class="btn-all-mods">查看更多模组集 →</a>
            </p>
        </section>
    </main>

    <footer class="site-footer">
        <p class="footer-note">
            SkillUNO 模组商店 ·
            <a href="https://github.com/zhuyiming0208/SkillUNO">GitHub</a> ·
            <a href="https://github.com/zhuyiming0208/SkillUNO/blob/main/mods/HOW_TO_MAKE_A_MOD.md">制作模组</a>
        </p>
    </footer>

    <script>window.DATA_ROOT = "mods/"; window.COLLECTIONS_URL = "collections/collections.json";</script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/render.js"></script>
    <script src="assets/js/collections.js"></script>
    <script>
        (async function init() {
            try {
                const official = await loadOfficialMods();
                renderModList(official, 'official-grid');

                const index = await loadModIndex();
                const files = [
                    ...(index.handpicked || []),
                    ...(index.other || []),
                ];
                const mods = await Promise.all(files.map(loadMod));
                renderModList(mods, 'handpicked-grid');
            } catch (err) {
                console.error(err);
                document.getElementById('official-grid').innerHTML =
                    '<p class="error">无法加载模组数据，请检查网络</p>';
                document.getElementById('handpicked-grid').innerHTML =
                    '<p class="error">无法加载模组数据，请检查网络</p>';
            }

            // 模组集分区
            try {
                const cdata = await loadCollections();
                const cols = (cdata.collections || []).slice(0, 3);
                const cgrid = document.getElementById('collection-grid');
                if (cols.length === 0) {
                    cgrid.innerHTML = '<p class="empty">暂无模组集</p>';
                } else {
                    cgrid.innerHTML = cols.map(c => `
                        <a class="collection-card" href="collections/detail.html?id=${encodeURIComponent(c.id)}">
                            <h3>${escapeHtml(c.name || '未命名')}</h3>
                            <p class="collection-count">${(c.mods || []).length} 个模组</p>
                            ${c.description ? `<p class="desc">${escapeHtml(c.description)}</p>` : ''}
                        </a>
                    `).join('');
                }
            } catch (err) {
                console.warn('模组集加载失败：', err);
                document.getElementById('collection-grid').innerHTML =
                    '<p class="error">无法加载模组集</p>';
            }
        })();
    </script>
</body>
</html>
